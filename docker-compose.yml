name: culinaryblog

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: culinary_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      hangfire-auth:
        condition: service_completed_successfully
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:?copy .env.example to .env first}
      NGINX_ENVSUBST_FILTER: MINIO_BUCKET
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - hangfire-auth:/etc/nginx/auth:ro

  hangfire-auth:
    image: httpd:2.4.65-alpine
    restart: "no"
    environment:
      HANGFIRE_USER: ${HANGFIRE_USER:?set HANGFIRE_USER in .env first}
      HANGFIRE_PASSWORD: ${HANGFIRE_PASSWORD:?set HANGFIRE_PASSWORD in .env first}
    entrypoint: /bin/sh
    command:
      - -c
      - 'printf "%s\n" "$$HANGFIRE_PASSWORD" | htpasswd -ni "$$HANGFIRE_USER" > /auth/hangfire.htpasswd'
    volumes:
      - hangfire-auth:/auth

  api:
    build:
      context: ./src/Backend
      dockerfile: Dockerfile
    container_name: culinary_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      FileStorage__Provider: S3
      FileStorage__PublicBaseUrl: /media
      FileStorage__S3__ServiceUrl: http://minio:9000
      FileStorage__S3__AccessKey: ${MINIO_ROOT_USER:?copy .env.example to .env first}
      FileStorage__S3__SecretKey: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env first}
      FileStorage__S3__BucketName: ${MINIO_BUCKET:?copy .env.example to .env first}

  web:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
    container_name: culinary_web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env first}
      AUTH_TRUST_HOST: "true"
      HOSTNAME: 0.0.0.0
      PORT: 3000

  postgres:
    image: postgres:16.15-alpine3.24
    container_name: culinary_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine3.21
    container_name: culinary_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copy .env.example to .env first}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?copy .env.example to .env first}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Digest đã được kiểm chứng theo ADR-003; không đổi thành tag floating.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: culinary_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env first}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: culinary_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env first}
      MINIO_BUCKET: ${MINIO_BUCKET:?copy .env.example to .env first}
    entrypoint: >-
      /bin/sh -c 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
      && mc mb --ignore-existing "local/$$MINIO_BUCKET"
      && mc anonymous set download "local/$$MINIO_BUCKET"'

  seq:
    image: datalust/seq:2026.1.17114
    container_name: culinary_seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?copy .env.example to .env first}
    ports:
      - "${SEQ_PORT}:80"
    volumes:
      - seqdata:/data

  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: culinary_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"

volumes:
  hangfire-auth:
  pgdata:
  redisdata:
  miniodata:
  seqdata:
